// Mk3Expansion Waterfall Config - M3X_XLTurbofan (Wellington)
// Based on M2X_TurbofanMk2 Waterfall template
@PART[M3X_XLTurbofan]:NEEDS[Waterfall&StockWaterfallEffects|Waterfall&WaterfallRestock]:AFTER[Mk3Expansion]
{
  // Removes the stock effect block, and replace it with one that has no particles
  !EFFECTS {}
	EFFECTS
	{		
		running_thrust
		{			
			AUDIO
			{
				channel = Ship
				clip = Mk3Expansion/Sounds/sound_jet_afterburn_heavy
				volume = 0.0 0.0
				volume = 0.33 0.0
				volume = 1.0 1.0
				pitch = 0.0 0.8
				pitch = 1.0 1.3
				loop = true
			}
		}
		running_turbine
		{
			AUDIO
			{
				channel = Ship
				clip = Mk3Expansion/Sounds/sound_jet_low_med
				volume = 0.0 0.0
				volume = 0.05 0.8
				volume = 1.0 0.9
				pitch = 0.0 0.4
				pitch = 0.05 0.5
				pitch = 0.33 1.3
				pitch = 1.0 1.8
				loop = true
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_medium
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = thrustTransform
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}
	
@MODULE[ModuleEngines*]
	{
	  %powerEffectName = running_thrust
	  %spoolEffectName = running_turbine
	}
	
  MODULE
  {
	name = ModuleWaterfallFX
	moduleID = wellingtonFX
	CONTROLLER
	{
		name = atmosphereDepth
		linkedTo = atmosphere_density
	}
	CONTROLLER
	{
		name = throttle
		linkedTo = throttle
		responseRateUp = 0.02
		responseRateDown = 0.02
	}
	CONTROLLER
	{
		name = mach
		linkedTo = mach
	}
	TEMPLATE
    {
      templateName = Mk2X-kerozine-turbofan-1
      overrideParentTransform = thrustTransform
	  position = 0,0,0
	  rotation = 0, 0, 0
	  scale = 1.5, 1.5, 1.5
    }
  }
}
