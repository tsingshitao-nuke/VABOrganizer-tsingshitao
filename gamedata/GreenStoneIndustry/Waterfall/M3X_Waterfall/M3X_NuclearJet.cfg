// Mk3Expansion Waterfall Config - M3X_NuclearJet (Sievert)
// Based on M2X_AtomicJet Waterfall template
@PART[M3X_NuclearJet]:NEEDS[Waterfall&StockWaterfallEffects|Waterfall&WaterfallRestock]:AFTER[Mk3Expansion]
{
  !EFFECTS {}
	EFFECTS
	{		
		running_thrust
		{			
			AUDIO
			{
				channel = Ship
				clip = Mk3Expansion/Sounds/sound_jet_deep
				volume = 0.0 0.0
				volume = 0.05 0.4
				volume = 1.0 1.0
				pitch = 0.0 0.7
				pitch = 1.0 1.0
				loop = true
			}
		}
		running_turbine
		{
			AUDIO
			{
				channel = Ship
				clip = Mk3Expansion/Sounds/sound_jet_low_med
				volume = 0.0 0.0
				volume = 0.05 0.7
				volume = 1.0 1.1
				pitch = 0.0 0.5
				pitch = 0.05 0.6
				pitch = 1.0 1.0
				loop = true
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_medium
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = thrustTransform
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}
	
@MODULE[ModuleEngines*]
	{
	  %powerEffectName = running_thrust
	  %spoolEffectName = running_turbine
	}
	
  MODULE
  {
	name = ModuleWaterfallFX
	moduleID = sievertFX
	CONTROLLER
	{
		name = atmosphereDepth
		linkedTo = atmosphere_density
	}
	CONTROLLER
	{
		name = throttle
		linkedTo = throttle
		engineID = basicEngine
		responseRateUp = 0.02
		responseRateDown = 0.02
	}
	CONTROLLER
	{
		name = mach
		linkedTo = mach
	}
	CONTROLLER
	{
		name = random1
		linkedTo = random
		noiseType = perlin
		scale = 0.5
		minimum = -0.5
		speed = 8
		seed = 15
	}
	CONTROLLER
	{
		name = random2
		linkedTo = random
		noiseType = perlin
		scale = 0.5
		minimum = -0.5
		speed = 10
		seed = 15
	}
    TEMPLATE
    {
      templateName = Mk2X-kerozine-turbofan-1
      overrideParentTransform = thrustTransform
      scale = 0.6,0.6,0.7
      rotation = 0,0,0
      position = 0,0,-0.25
    }
  }
}
