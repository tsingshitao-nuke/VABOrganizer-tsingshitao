// Mk3Expansion Waterfall Config - M3X_TurboJet (Wyvern)
// Based on M2X_Turbojet Waterfall template
@PART[M3X_TurboJet]:NEEDS[Waterfall&StockWaterfallEffects|Waterfall&WaterfallRestock]:AFTER[Mk3Expansion]
{
  // Removes the stock effect block, and replace it with one that has no particles
  !EFFECTS {}
  	EFFECTS
	{
		power_dry
		{
			AUDIO
			{
				channel = Ship
				clip = Mk3Expansion/Sounds/sound_jet_afterburn_heavy
				volume = 0.0 0.0
				volume = 0.33 0.0
				volume = 1.0 1.2
				pitch = 0.0 0.8
				pitch = 1.0 1.4
				loop = true
			}
		}
		power_wet
		{
			AUDIO
			{
				channel = Ship
				clip = Mk3Expansion/Sounds/sound_jet_afterburn_heavy
				volume = 0.0 0.0
				volume = 0.05 0.8
				volume = 1.0 1.2
				pitch = 0.0 0.8
				pitch = 1.0 1.3
				loop = true
			}
		}
		running_dry
		{
			AUDIO
			{
				channel = Ship
				clip = Mk3Expansion/Sounds/sound_jet_low_heavy
				volume = 0.0 0.0
				volume = 0.05 0.8
				volume = 1.0 0.5
				pitch = 0.0 0.4
				pitch = 0.05 0.7
				pitch = 0.33 1.0
				pitch = 1.0 1.7
				loop = true
			}
		}
		running_wet
		{
			AUDIO
			{
				channel = Ship
				clip = Mk3Expansion/Sounds/sound_jet_low_heavy
				volume = 0.0 0.0
				volume = 0.05 0.4
				volume = 1.0 0.4
				pitch = 0.0 0.4
				pitch = 0.05 0.5
				pitch = 0.33 1.0
				pitch = 1.0 1.55
				loop = true
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = thrustTransform
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}
	
@MODULE[ModuleEngines*],0
	{
	  %powerEffectName = power_dry
	  %spoolEffectName = power_dry
	}
@MODULE[ModuleEngines*],1
	{
	  %runningEffectName = running_wet
	  %spoolEffectName = power_wet
	}
	
  MODULE
  {
	name = ModuleWaterfallFX
	moduleID = wyvernDry
	CONTROLLER
	{
		name = atmosphereDepth
		linkedTo = atmosphere_density
	}
	CONTROLLER
	{
		name = throttle
		linkedTo = throttle
		engineID = Dry
		responseRateUp = 0.01
		responseRateDown = 0.01
	}
	CONTROLLER
	{
		name = mach
		linkedTo = mach
	}
	TEMPLATE
    {
      templateName = Mk2X-kerozine-turbofan-2
      overrideParentTransform = thrustTransform
      position = 0,0,0
      rotation = 0, 0, 0
      scale = 1, 1, 1
    }
  }
  
MODULE
  {
    name = ModuleWaterfallFX
    moduleID = wyvernWet
    
    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    CONTROLLER
    {
      name = throttle
	  linkedTo = throttle
	  engineID = Wet
	  responseRateUp = 0.001
      responseRateDown = 0.016
    }
	CONTROLLER
	{
		name = mach
		linkedTo = mach
	}
    TEMPLATE
    {
      templateName = Mk2X-kerozine-afterburner
      overrideParentTransform = thrustTransform
      position = 0,0,0
      rotation = 0, 0, 0
      scale = 1.1, 1.1, 1.2
    }
  }
}
