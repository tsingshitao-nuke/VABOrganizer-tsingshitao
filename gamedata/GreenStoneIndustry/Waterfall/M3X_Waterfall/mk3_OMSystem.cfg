// Mk3Expansion Waterfall Config - mk3_OMSystem (Coxswain)
// Based on M2X_OMSpod Waterfall template
// NOTE: Preserves RCS MODEL_MULTI_PARTICLE effects for ModuleRCSFX
@PART[mk3_OMSystem]:NEEDS[Waterfall]:AFTER[Mk3Expansion]
{
  !EFFECTS {}
  EFFECTS
	{
		running
		{
			AUDIO_MULTI_POOL
			{
				channel = Ship
				transformName = RCSThruster
				clip = sound_rocket_mini
				volume = 0.0 0.0
				volume = 0.1 0.0
				volume = 0.5 0.025
				volume = 1.0 0.1
				pitch = 0.0 0.75
				pitch = 1.0 1.5
				loop = true
			}
		}
		power_effect
		{
			AUDIO
			{
				channel = Ship
				clip = sound_rocket_mini
				volume = 0.0 0.0
				volume = 1.0 0.5
				pitch = 0.0 0.5
				pitch = 1.0 1.0
				loop = true
			}
		}	
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = thrustTransform
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}	
	}
  
  @MODULE[ModuleEngines*]
  {
    %runningEffectName = power_effect
  }
  
  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = coxswainFX
    
    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    CONTROLLER
    {
      name = throttle
      linkedTo = throttle
	  engineID = basicEngine
	  responseRateUp = 0.03
      responseRateDown = 0.2
    }
	CONTROLLER
    {
      name = random1
      linkedTo = random
	  noiseType = perlin
	  scale = 1
	  speed = 2
	  seed = 3
    }
	CONTROLLER
    {
      name = random2
      linkedTo = random
	  noiseType = perlin
	  scale = 1
	  speed = 7
	  seed = 30
    }
   
    TEMPLATE
    {
      templateName = waterfall-hypergolic-aerozine50-upper-1
      overrideParentTransform = thrustTransform
      scale = 0.6, 0.6, 0.6
      rotation = 0,0,0
      position = 0,0,0
    }
    TEMPLATE
    {
      templateName = waterfall-nozzle-glow-blue-1
      overrideParentTransform = thrustTransform
      scale = 0.6, 0.6, 0.6
      rotation = 0,0,0
      position = 0,0,0
    }
  }
  
  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = coxswainRCSFX
    engineID = basicEngine

    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    CONTROLLER
    {
      name = rcs
      linkedTo = rcs
      responseRateUp = 0.7
      responseRateDown = 0.7
    }
    CONTROLLER
    {
      name = R1
      linkedTo = random
      noiseType = perlin
      scale = 1
      minimum = 0
      speed = 12
      seed = 1
    }

    TEMPLATE
    {
      templateName = stock-rcs-jet-3
      overrideParentTransform = RCSTransform
      position = 0,-0.15,0
      rotation = 0, 0, 180
      scale = 0.5, 0.5, 0.5
    }
  }
}
