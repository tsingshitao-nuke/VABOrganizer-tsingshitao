// Mk3Expansion Waterfall Config - M3X_ConcentricAerospike (Cyclone)
// Based on M2X_LinearAerospike Waterfall template
@PART[M3X_ConcentricAerospike]:NEEDS[Waterfall]:AFTER[Mk3Expansion]
{
  !fx_exhaustFlame_blue = DELETE
  !fx_exhaustLight_blue = DELETE
  !fx_smokeTrail_light = DELETE
  !sound_vent_medium = DELETE
  !sound_rocket_hard = DELETE
  !sound_vent_soft = DELETE
  !sound_explosion_low = DELETE
  
  !EFFECTS {}
  EFFECTS
	{
		running_closed
		{
			AUDIO
			{
				channel = Ship
				clip = sound_rocket_hard
				volume = 0.0 0.0
				volume = 1.0 1.0
				pitch = 0.0 0.2
				pitch = 1.0 1.0
				loop = true
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = thrustTransform
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}
  
  @MODULE[ModuleEngines*]
  {
    @name = ModuleEnginesFX
	%runningEffectName = running_closed
	!powerEffectName
  }
  
  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = cycloneFX
    
    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    CONTROLLER
    {
      name = throttle
      linkedTo = throttle
	  engineID = basicEngine
	  responseRateUp = 0.03
      responseRateDown = 0.2
    }
	CONTROLLER
    {
      name = random1
      linkedTo = random
	  noiseType = perlin
	  scale = 1
	  speed = 2
	  seed = 3
    }
	CONTROLLER
    {
      name = random2
      linkedTo = random
	  noiseType = perlin
	  scale = 1
	  speed = 7
	  seed = 30
    }
	CONTROLLER
    {
      name = random3
      linkedTo = random
	  noiseType = perlin
	  scale = 1
	  speed = 7
	  seed = 300
    }
	CONTROLLER
    {
      name = random4
      linkedTo = random
	  noiseType = perlin
	  scale = 1
	  speed = 7
	  seed = 3000
    }
   
    TEMPLATE
    {
      templateName = Mk2X-hydrolox-aerospike
      overrideParentTransform = thrustTransform
      scale = 1.8, 1.8, 1.8
      rotation = 0,0,0
      position = 0,0,0
    }
  }
}
