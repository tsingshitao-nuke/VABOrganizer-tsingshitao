		speed = 10
		seed = 0
	}
	CONTROLLER
	{
		name = Ignition
		linkedTo = engineEvent
		eventDuration = 2
		eventName = ignition
		eventCurve
		{
			key = 0 0 10 10
			key = 0.1 1 4.444445 4.444445
			key = 1 0 -1.111111 -1.111111
		}
	}
	
	TEMPLATE
    {
      templateName = waterfall-nozzle-glow-blue-1
	  position = 0,0,-0.01
	  rotation = 0, 0, 0
	  scale = 0.8, 0.8, 1.0
    }
    TEMPLATE
    {
      templateName = waterfall-methalox-lower-raptor-1
	  position = 0,0,0
