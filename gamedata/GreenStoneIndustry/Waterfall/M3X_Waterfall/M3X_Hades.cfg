// Mk3Expansion Waterfall Config - M3X_Hades (Nuclear Engine)
// Based on M2X_Pluto Waterfall template
@PART[M3X_Hades]:NEEDS[Waterfall&StockWaterfallEffects|Waterfall&WaterfallRestock]:AFTER[Mk3Expansion]
{
  !EFFECTS {}
  EFFECTS
	{
		running_closed
		{
			AUDIO
			{
				channel = Ship
				clip = sound_rocket_hard
				volume = 0.0 0.0
				volume = 1.0 1.0
				pitch = 0.0 0.2
				pitch = 1.0 1.0
				loop = true
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = thrustTransform
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}
  
  @MODULE[ModuleEngines*]
  {
    %runningEffectName = running_closed
  }
  
  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = hadesFX
    
    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    CONTROLLER
    {
      name = throttle
      linkedTo = throttle
	  engineID = basicEngine
	  responseRateUp = 0.03
      responseRateDown = 0.2
    }
	CONTROLLER
    {
      name = random1
      linkedTo = random
	  noiseType = perlin
	  scale = 1
	  speed = 2
	  seed = 3
    }
	CONTROLLER
    {
      name = random2
      linkedTo = random
	  noiseType = perlin
	  scale = 1
	  speed = 7
	  seed = 30
    }
   
    TEMPLATE
    {
      templateName = waterfall-ntr-lh2-1
      overrideParentTransform = thrustTransform
      scale = 2.5, 2.5, 2.2
      rotation = 0,0,0
      position = 0,0,-1.5
    }
    TEMPLATE
    {
      templateName = waterfall-nozzle-glow-white-1
      overrideParentTransform = thrustTransform
      scale = 1.5, 1.5, 1.8
      rotation = 0,0,0
      position = 0,0,0.05
    }
  }
}
