// Mk3Expansion Waterfall Config - M3X_IonEngine
// Based on M2X_IonEngine Waterfall template
@PART[M3X_IonEngine]:NEEDS[Waterfall]:AFTER[Mk3Expansion]
{
  !EFFECTS {}
  EFFECTS
	{
		main_effect
		{
			AUDIO
			{
				channel = Ship
				clip = sound_ion_loop
				volume = 0.0 0.0
				volume = 1.0 1.0
				pitch = 0.0 0.5
				pitch = 1.0 1.0
				loop = true
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = thrustTransform
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}
  
  @MODULE[ModuleEngines*]
  {
    %powerEffectName = main_effect
  }
  
  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = mk3ionFX
    
    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    CONTROLLER
    {
      name = throttle
      linkedTo = throttle
	  engineID = basicEngine
	  responseRateUp = 0.03
      responseRateDown = 0.2
    }
   
    TEMPLATE
    {
      templateName = waterfall-ion-xenon-1
      overrideParentTransform = thrustTransform
      scale = 2.0, 2.0, 2.0
      rotation = 0,0,0
      position = 0,1.3,-0.35
    }
    TEMPLATE
    {
      templateName = waterfall-ion-xenon-1
      overrideParentTransform = thrustTransform
      scale = 2.0, 2.0, 2.0
      rotation = 0,0,0
      position = 0,-1.3,-0.35
    }
    TEMPLATE
    {
      templateName = waterfall-ion-xenon-1
      overrideParentTransform = thrustTransform
      scale = 2.5, 2.5, 2.5
      rotation = 0,0,0
      position = 0,0,-0.35
    }
  }
}
