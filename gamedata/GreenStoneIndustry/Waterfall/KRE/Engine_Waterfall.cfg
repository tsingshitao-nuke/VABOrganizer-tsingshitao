// SuperDraco Engine Waterfall Config
// Uses NearFutureSpacecraft's template-nfs-superdraco-1 template

@PART[SmallCapsuleEngine]:NEEDS[Waterfall&StockWaterfallEffects|Waterfall&WaterfallRestock]:FIRST
{
  !EFFECTS {}
  EFFECTS
  {
    running
    {
      AUDIO
      {
        channel = Ship
        clip = Waterfall/Sounds/Beale_Sounds/Sound_RocketStentor
        volume = 0.0 0.0
        volume = 1.0 1.0
        pitch = 0.0 0.8
        pitch = 1.0 1.0
        loop = true
      }
    }
  }
  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = SuperDracoFX
    engineID = basicEngine

    CONTROLLER
    {
      name = throttle
      linkedTo = throttle
    }
    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    CONTROLLER
    {
      name = R1
      linkedTo = random
      noiseType = perlin
      scale = 1
      minimum = 0
      speed = 12
      seed = 1
    }

    TEMPLATE
    {
      templateName = template-superdraco-KRE
      overrideParentTransform = thrustTransform
      position = 0,0,0
      rotation = 0,0,0
      scale = 1,1,1
    }
  }
}

@PART[SmallCapsuleEngineRCS]:NEEDS[Waterfall&StockWaterfallEffects|Waterfall&WaterfallRestock]:FIRST
{
  !EFFECTS {}
  EFFECTS
  {
    running
    {
      AUDIO
      {
        channel = Ship
        clip = Waterfall/Sounds/Beale_Sounds/Sound_RocketStentor
        volume = 0.0 0.0
        volume = 1.0 1.0
        pitch = 0.0 0.8
        pitch = 1.0 1.0
        loop = true
      }
    }
    runningRCS
    {
      AUDIO
      {
        channel = Ship
        clip = Waterfall/Sounds/Beale_Sounds/Sound_RocketStentor
        volume = 0.0 0.0
        volume = 0.02 0.2
        volume = 0.5 0.2
        volume = 1.0 0.2
        pitch = 0.0 0.75
        pitch = 1.0 1.5
        loop = true
      }
    }
  }
  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = SuperDracoFX
    engineID = basicEngine

    CONTROLLER
    {
      name = throttle
      linkedTo = throttle
    }
    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    CONTROLLER
    {
      name = R1
      linkedTo = random
      noiseType = perlin
      scale = 1
      minimum = 0
      speed = 12
      seed = 1
    }

    TEMPLATE
    {
      templateName = template-superdraco-KRE
      overrideParentTransform = thrustTransform
      position = 0,0,0
      rotation = 0,0,0
      scale = 1,1,1
    }
  }
  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = SuperDracoRCSFX

    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    CONTROLLER
    {
      name = rcs
      linkedTo = rcs
      responseRateUp = 0.7
      responseRateDown = 0.7
    }
    CONTROLLER
    {
      name = R1
      linkedTo = random
      noiseType = perlin
      scale = 1
      minimum = 0
      speed = 12
      seed = 1
    }

    TEMPLATE
    {
      templateName = stock-rcs-jet-3
      overrideParentTransform = RCSthruster
      position = 0,0,0
      rotation = 0, 0, 180
      scale = 0.5, 0.5, 0.5
    }
  }
}
