@PART[AoA.Mk22Vector]:NEEDS[Waterfall]:FOR[ZZZ_MyPatches]
{
  // =========================
  // 删除原版特效（必须）
  // =========================
  !EFFECTS {}
{
  EFFECTS
  {
    // ================= DRY =================
    fx-mk22-dry-spool
    {
      AUDIO
      {
        channel = Ship
        clip = sound_jet_low
        volume = 0.0 0.0
        volume = 0.0001 0.7
        volume = 1.0 1.0
        pitch = 0.0 0.5
        pitch = 1.0 0.9
        loop = true
      }
    }

    fx-mk22-dry-power {}

    // ================= WET =================
    fx-mk22-wet-spool
    {
      AUDIO
      {
        channel = Ship
        clip = sound_jet_low
        volume = 0.0 0.0
        volume = 0.0001 0.9
        volume = 1.0 1.2
        pitch = 0.0 0.6
        pitch = 1.0 1.2
        loop = true
      }
    }

    fx-mk22-wet-running
    {
      AUDIO
      {
        channel = Ship
        clip = sound_rocket_spurts
        volume = 0.1 0.0
        volume = 0.3 1.0
        volume = 1.0 1.4
        pitch = 0.0 0.7
        pitch = 1.0 1.3
        loop = true
      }
    }
  }



}

  // =========================
  // Waterfall - Dry（F22扁平尾焰）
  // =========================
  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = MK22DryF22

    CONTROLLER
    {
      name = throttle
      linkedTo = throttle
      engineID = Dry
      responseRateUp = 0.03
      responseRateDown = 0.04
    }

    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }

    TEMPLATE
    {
      templateName = stock-kerozine-turbofan-2
      overrideParentTransform = thrustTransform

      // 🔥 F22扁平喷口
      scale = 1.3,0.55,1.8
      position = 0,0,0.5
      rotation = 0,0,0
    }
  }
@MODULE[ModuleEnginesFX],*
  {
    %stagingEnabled = False
    %EngineIgnited = False
  }
  // =========================
  // Waterfall - Wet（F22加力+马赫环）
  // =========================
  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = MK22WetF22

    CONTROLLER
    {
      name = throttle
      linkedTo = throttle
      engineID = Wet
      responseRateUp = 0.015
      responseRateDown = 0.05
    }

    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }

    CONTROLLER
    {
      name = mach
      linkedTo = mach
    }

    // 🔥 主加力火焰（蓝焰）
    TEMPLATE
    {
      templateName = stock-kerozine-afterburner-3
      overrideParentTransform = thrustTransform

      scale = 1.2,0.49,1
      position = 0,0,0.5
    }

    // 💠 马赫环（关键视觉）
    TEMPLATE
    {
      templateName = stock-kerozine-afterburner-shock-1
      overrideParentTransform = thrustTransform

      scale = 1.5,0.5,2.5
      position = 0,0,0.2
    }
  }
}