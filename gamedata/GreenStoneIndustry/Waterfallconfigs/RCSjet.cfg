@PART[rcsJet]:NEEDS[Waterfall]:FOR[WaterfallRestock]
{
  // =========================
  // 修复/重写 EFFECTS（保留 running）
  // =========================
  @EFFECTS
  {
    @running
    {
      !PREFAB_PARTICLE,* {}

      AUDIO_MULTI_POOL
      {
        channel = Ship
        transformName = rcsTransform
        clip = Waterfall/Sounds/Beale_Sounds/Sound_RocketStentor

        volume = 0.0 0.0
        volume = 0.2 0.02
        volume = 0.5 0.08
        volume = 1.0 0.18

        pitch = 0.0 0.8
        pitch = 1.0 1.3

        loop = true
      }
    }
  }

  // =========================
  // 确保RCS调用正确FX
  // =========================
  @MODULE[ModuleRCSFX]
  {
    %runningEffectName = running
  }

  // =========================
  // Waterfall 主模块
  // =========================
  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = rcsJetFX
    engineID = basicEngine

    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }

    CONTROLLER
    {
      name = rcs
      linkedTo = rcs
    }

    CONTROLLER
    {
      name = random
      linkedTo = random
      noiseType = perlin
      scale = 1
      minimum = 0
      speed = 10
      seed = 2
    }

    // 🌫️ 主喷气流
    TEMPLATE
    {
      templateName = stock-rcs-jet-3
      overrideParentTransform = rcsTransform

	 position = 0,-0.2,0
	 rotation = 0, 0, 180
	 scale = 2, 2, 3
    }


    
  }
}