@PART[K-35BAB]:NEEDS[Waterfall]:FOR[WaterfallRestock]
{
  !EFFECTS {}

  EFFECTS
  {
    fx-k35-dry-spool
    {
      AUDIO
      {
        channel = Ship
        clip = sound_jet_low
        volume = 0.0 0.0
        volume = 0.0001 1.0
        volume = 1.0 1.2
        pitch = 0.0 0.3
        pitch = 1.0 0.9
        loop = true
      }
    }

    fx-k35-dry-power { }

    fx-k35-wet-spool
    {
      AUDIO
      {
        channel = Ship
        clip = sound_jet_low
        volume = 0.0 0.0
        volume = 0.0001 0.9
        volume = 1.0 1.1
        pitch = 0.0 0.4
        pitch = 1.0 1.4
        loop = true
      }
    }

    fx-k35-wet-running
    {
      AUDIO
      {
        channel = Ship
        clip = sound_jet_deep
        volume = 0.1 0.0
        volume = 0.3 1.0
        volume = 1.0 1.3
        pitch = 0.0 0.5
        pitch = 1.0 1.0
        loop = true
      }
    }
  }

  @MODULE[ModuleEnginesFX],0
  {
    %powerEffectName = fx-k35-dry-power
    %spoolEffectName = fx-k35-dry-spool
  }

  @MODULE[ModuleEnginesFX],1
  {
    %runningEffectName = fx-k35-wet-running
    %spoolEffectName = fx-k35-wet-spool
  }

  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = K35Dry

    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }

    CONTROLLER
    {
      name = throttle
      linkedTo = throttle
      engineID = Dry
      responseRateUp = 0.015
      responseRateDown = 0.02
    }

    CONTROLLER
    {
      name = mach
      linkedTo = mach
    }

    TEMPLATE
    {
      templateName = stock-kerozine-turbofan-2
      overrideParentTransform = thrustTransform
      position = 0,0,0.0
      rotation = 0,0,0
      scale = 1.1,1.1,1.1
    }
  }

  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = K35Wet

    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }

    CONTROLLER
    {
      name = throttle
      linkedTo = throttle
      engineID = Wet
      responseRateUp = 0.002
      responseRateDown = 0.02
    }

    CONTROLLER
    {
      name = mach
      linkedTo = mach
    }

    TEMPLATE
    {
      templateName = stock-kerozine-afterburner-3
      overrideParentTransform = thrustTransform
      position = 0,0,0.0
      rotation = 0,0,0
      scale = 1.15,1.15,1.15
    }
  }
}
