@PART[MPR-SaturnAL41]:NEEDS[Waterfall]:FOR[WaterfallRestock]
{
  // Remove stock particle effects (audio kept via EFFECTS below)
  !EFFECTS {}

  EFFECTS
  {
    fx-al41-dry-spool
    {
      AUDIO
      {
        channel = Ship
        clip = sound_jet_low
        volume = 0.0 0.0
        volume = 0.0001 1.2
        volume = 1.0 1.4
        pitch = 0.0 0.3
        pitch = 1.0 1.0
        loop = true
      }
    }

    fx-al41-dry-power { }

    fx-al41-wet-spool
    {
      AUDIO
      {
        channel = Ship
        clip = sound_jet_low
        volume = 0.0 0.0
        volume = 0.0001 0.8
        volume = 1.0 1.0
        pitch = 0.0 0.3
        pitch = 1.0 1.5
        loop = true
      }
    }

    fx-al41-wet-running
    {
      AUDIO
      {
        channel = Ship
        clip = sound_jet_deep
        volume = 0.1 0.0
        volume = 0.3 1.2
        volume = 1.0 1.4
        pitch = 0.0 0.4
        pitch = 1.0 1.0
        loop = true
      }
    }
  }

  // ==============================
  // ENGINE MODULE HOOKUP
  // ==============================

  @MODULE[ModuleEnginesFX],0
  {
    %powerEffectName = fx-al41-dry-power
    %spoolEffectName = fx-al41-dry-spool
  }

  @MODULE[ModuleEnginesFX],1
  {
    %runningEffectName = fx-al41-wet-running
    %spoolEffectName = fx-al41-wet-spool
  }

  // ==============================
  // DRY / MIL POWER WATERFALL
  // ==============================

  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = AL41Dry

    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }

    CONTROLLER
    {
      name = throttle
      linkedTo = throttle
      engineID = Dry
      responseRateUp = 0.01
      responseRateDown = 0.01
    }

    CONTROLLER
    {
      name = mach
      linkedTo = mach
    }

    TEMPLATE
    {
      templateName = stock-kerozine-turbofan-2
      overrideParentTransform = thrustTransform
      position = 0,0,0.0
      rotation = 0,0,0
      scale = 1.20,1.20,1.20
    }
  }

  // ==============================
  // WET / AFTERBURNER WATERFALL
  // ==============================

    MODULE
  {
	name = ModuleWaterfallFX
	moduleID = AL41Wet
	CONTROLLER
	{
		name = atmosphereDepth
		linkedTo = atmosphere_density
	}
	CONTROLLER
	{
		name = throttle
		linkedTo = throttle
		engineID = Dry
		responseRateUp = 0.01
		responseRateDown = 0.01
	}
	CONTROLLER
	{
		name = mach
		linkedTo = mach
	}
	CONTROLLER
	{
		name = R1
		linkedTo = random
		noiseType = perlin
		scale = 1
		minimum = 0
		speed = 4
		seed = 2
	}
	CONTROLLER
	{
		name = R2
		linkedTo = random
		noiseType = perlin
		scale = 1
		minimum = 0
		speed = 4
		seed = 11
	}
	CONTROLLER
	{
		name = R3
		linkedTo = random
		noiseType = perlin
		scale = 1
		minimum = 0
		speed = 4
		seed = 23
	}
	CONTROLLER
	{
		name = R4
		linkedTo = random
		noiseType = perlin
		scale = 1
		minimum = 0
		speed = 4
		seed = 37
	}
	TEMPLATE
    {
      templateName = stock-kerozine-afterburner-2
      overrideParentTransform = thrustTransform
      position = 0,0,0
      rotation = 0, 0, 0
      scale = 1, 1, 1
    }
  }
}
