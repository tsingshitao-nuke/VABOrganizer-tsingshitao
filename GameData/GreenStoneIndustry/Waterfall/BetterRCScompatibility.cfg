@PART[HotGasThruster-L]:NEEDS[z_BetterRCS]:FINAL
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[HotGasLFX]]
    {
        @TEMPLATE
        {
            @rotation = 180, 0, 0
            @position = 0,0,0
        }
    }

    @MODULE[B9PartSwitch]:HAS[#moduleID[rcsPlume]]
    {
        @SUBTYPE[ColdGas]
        {
            @MODULE
            {
                @DATA
                {
                    @TEMPLATE
                    {
                        @position = 0,0,0
                        @rotation = 180,0,0
                        @scale = 0.4,0.6,0.4
                    }
                }
            }
        }
    }
}

