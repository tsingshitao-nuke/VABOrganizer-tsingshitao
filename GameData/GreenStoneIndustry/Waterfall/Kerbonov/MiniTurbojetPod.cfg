@PART[MiniTurbojetPod]:NEEDS[Waterfall&Kerbonov]:HAS[!MODULE[ModuleWaterfallFX]]
{
	!EFFECTS {}

	EFFECTS
	{
		fx-MiniTurbojetPod-running_thrust
		{
			AUDIO
			{
				channel = Ship
				clip = Kerbonov/Sounds/sound_turbo
				volume = 0.0 0.0
				volume = 0.05 0.3
				volume = 1.0 0.4
				pitch = 0.0 0.0
				pitch = 0.1 0.4
				pitch = 0.93 1.2
				pitch = 1.0 1.52
				loop = true
			}
		}
		fx-MiniTurbojetPod-running_turbine
		{
			AUDIO
			{
				channel = Ship
				clip = Kerbonov/Sounds/sound_running_fan
				volume = 0.0 0.0
				volume = 0.05 0.3
				volume = 1.0 0.4
				pitch = 0.0 0.0
				pitch = 0.1 0.4
				pitch = 0.93 1.2
				pitch = 1.0 1.52
				loop = true
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_medium
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}

	@MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesFX
		!runningEffectName
		!powerEffectName
		!spoolEffectName
		!engageEffectName
		!disengageEffectName
		!flameoutEffectName
		%runningEffectName = fx-MiniTurbojetPod-running_thrust
		%powerEffectName = fx-MiniTurbojetPod-running_thrust
		%spoolEffectName = fx-MiniTurbojetPod-running_turbine
		%engageEffectName = engage
		%disengageEffectName = disengage
		%flameoutEffectName = flameout
	}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = MiniTurbojetPodFX
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID =
			responseRateUp = 0.02
			responseRateDown = 0.02
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		RANDOMNESSCONTROLLER
		{
			name = random
			noiseType = perlin
			scale = 1
			minimum = 0
			speed = 10
			seed = 16
		}
		TEMPLATE
		{
			templateName = stock-kerozine-turbofan-1
			overrideParentTransform = thrustTransform
			position = 0,0,0.257
			rotation = 0, 0, 0
			scale = 0.18, 0.18, 0.18
		}
	}
}
