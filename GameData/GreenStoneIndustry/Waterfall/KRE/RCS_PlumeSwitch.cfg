@PART[HotGasThruster-L]:NEEDS[Waterfall&B9PartSwitch]
{
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = HotGasLFX
		engineID = basicEngine
		CONTROLLER
		{
			name = rcs
			linkedTo = rcs
			responseRateUp = 0.7
			responseRateDown = 0.7
		}
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = R1
			linkedTo = random
			noiseType = perlin
			scale = 1
			minimum = 0
			speed = 12
			seed = 1
		}
		TEMPLATE
		{
			templateName = stock-rcs-kerolox-1
			overrideParentTransform = RCSThrust
			position = 0,0.1,0
			rotation = 270,0,0
			scale = 0.3,0.3,0.3
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = rcsPlume
		switcherDescription = RCS Plume
		switchInFlight = False
		defaultSubtype = ColdGas
		SUBTYPE
		{
			name = ColdGas
			title = Cold Gas
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleWaterfallFX
					moduleID = HotGasLFX
				}
				DATA
				{
					CONTROLLER
					{
						name = rcs
						linkedTo = rcs
						responseRateUp = 0.7
						responseRateDown = 0.7
					}
					CONTROLLER
					{
						name = atmosphereDepth
						linkedTo = atmosphere_density
					}
					TEMPLATE
					{
						templateName = coldgas-rcs-tundra-1
						overrideParentTransform = RCSThrust
						position = 0,0.05,0
						rotation = 0,0,0
						scale = 0.3,0.5,0.3
					}
				}
			}
		}
		SUBTYPE
		{
			name = HotGas
			title = Liquid Fuel / Oxidizer
		}
	}
}

