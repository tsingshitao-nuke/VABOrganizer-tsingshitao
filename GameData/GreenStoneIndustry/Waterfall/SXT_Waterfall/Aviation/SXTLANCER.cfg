@PART[SXTLANCER]:NEEDS[Waterfall&SXT]:HAS[!MODULE[ModuleWaterfallFX]]
{
	!EFFECTS {}

	EFFECTS
	{
		fx-sxtlancer-air-power
		{
			AUDIO
			{
				channel = Ship
				clip = Waterfall/Sounds/KW/sound_altloop
				volume = 0.0 0.0
				volume = 1.0 1.0
				pitch = 0.0 1.0
				pitch = 1.0 1.0
				loop = true
			}
		}
		fx-sxtlancer-air-spool
		{
			AUDIO
			{
				channel = Ship
				clip = sound_jet_low
				volume = 0.0 0.0
				volume = 1.0 1.0
				pitch = 0.0 0.3
				pitch = 1.0 1.0
				loop = true
			}
		}
		fx-sxtlancer-closed-running
		{
			AUDIO
			{
				channel = Ship
				clip = Waterfall/Sounds/KW/sound_altloop
				volume = 0.0 0.0
				volume = 1.0 1.0
				pitch = 0.0 1.0
				pitch = 1.0 1.0
				loop = true
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_medium
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}

	@MODULE[ModuleEngines*]:HAS[#engineID[AirBreathing]]
	{
		!runningEffectName
		!powerEffectName
		!spoolEffectName
		!engageEffectName
		!disengageEffectName
		!flameoutEffectName
		%powerEffectName = fx-sxtlancer-air-power
		%spoolEffectName = fx-sxtlancer-air-spool
		%engageEffectName = engage
		%disengageEffectName = disengage
		%flameoutEffectName = flameout
	}

	@MODULE[ModuleEngines*]:HAS[#engineID[ClosedCycle]]
	{
		!runningEffectName
		!powerEffectName
		!spoolEffectName
		!engageEffectName
		!disengageEffectName
		!flameoutEffectName
		%runningEffectName = fx-sxtlancer-closed-running
		%engageEffectName = engage
		%disengageEffectName = disengage
		%flameoutEffectName = flameout
	}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = SXTLANCER-AirBreathing

		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = AirBreathing
			responseRateUp = 0.03
			responseRateDown = 0.2
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		CONTROLLER
		{
			name = random1
			linkedTo = random
			noiseType = perlin
			scale = 1
			minimum = 0
			speed = 10
			seed = 20
		}

		TEMPLATE
		{
			templateName = stock-rapier-core
			overrideParentTransform = thrustTransform
			position = 0,0,-0.202
			rotation = 0,0,0
			scale = 1.35, 1.35, 1.35
		}

		TEMPLATE
		{
			templateName = stock-methane-jet-2
			overrideParentTransform = thrustTransform
			position = 0,0,-0.202
			rotation = 0,0,0
			scale = 1.35, 1.35, 1.35
		}
	}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = SXTLANCER-ClosedCycle

		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = ClosedCycle
			responseRateUp = 0.03
			responseRateDown = 0.2
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		CONTROLLER
		{
			name = Ignition
			linkedTo = engineEvent
			eventDuration = 2
			eventName = ignition
			eventCurve
			{
				key = 0 0 10 10
				key = 0.1 1 4.444445 4.444445
				key = 1 0 -1.111111 -1.111111
			}
		}
		CONTROLLER
		{
			name = random1
			linkedTo = random
			noiseType = perlin
			scale = 1
			minimum = 0
			speed = 10
			seed = 20
		}

		TEMPLATE
		{
			templateName = stock-rapier-core
			overrideParentTransform = thrustTransform
			position = 0,0,-0.202
			rotation = 0,0,0
			scale = 1.35, 1.35, 1.35
		}

		TEMPLATE
		{
			templateName = stock-methalox-lower-2
			overrideParentTransform = thrustTransform
			position = 0,0,0.014
			rotation = 0,0,0
			scale = 0.472, 0.472, 0.472
		}
	}

}
