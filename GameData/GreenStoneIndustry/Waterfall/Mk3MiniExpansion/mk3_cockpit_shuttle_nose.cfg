@PART[mk3_shuttle_noseCone]:AFTER[Mk3MiniExpansion]
{
	!MODULE[ModuleRCS] {}

	EFFECTS
	{
		running
		{
			AUDIO_MULTI_POOL
			{
				channel = Ship
				transformName = RCS
				clip = sound_rocket_mini
				volume = 0.0 0.0
				volume = 0.1 0.0
				volume = 0.5 0.025
				volume = 1.0 0.1
				pitch = 0.0 0.75
				pitch = 1.0 1.5
				loop = true
			}
			MODEL_MULTI_PARTICLE
			{
				modelName = Squad/FX/Monoprop_small
				transformName = RCS
				emission = 0.0 0.0
				emission = 0.1 0.0
				emission = 1.0 1.0
				speed = 0.0 0.8
				speed = 1.0 1.0
				localRotation = -90, 0, 0
			}
		}
	}

	MODULE
	{
		name = ModuleRCSFX
		stagingEnabled = False
		thrusterTransformName = RCS
		thrusterPower = 2

		enablePitch = false

		resourceName = MonoPropellant
		resourceFlowMode = STAGE_PRIORITY_FLOW
		runningEffectName = running

		atmosphereCurve
		{
			key = 0 260
			key = 1 100
			key = 4 0.001
		}
	}
}


@PART[mk3_shuttle_noseCone]:NEEDS[Waterfall&StockWaterfallEffects|Waterfall&WaterfallRestock]:AFTER[Mk3MiniExpansion]
{
  // 删除原版粒子效果
  !EFFECTS {}

  // 保留声音（无粒子）
  EFFECTS
  {
    running
    {
      AUDIO_MULTI_POOL
      {
        channel = Ship
        transformName = RCS
        clip = sound_rocket_mini
        volume = 0.0 0.0
        volume = 0.1 0.0
        volume = 0.5 0.05
        volume = 1.0 0.1
        pitch = 0.0 0.75
        pitch = 1.0 1.5
        loop = true
      }
    }
  }

  // Waterfall 主效果
  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = rcsFX

    // 关键：RCSFX 用这个
    engineID = basicEngine

    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }

    CONTROLLER
    {
      name = rcs
      linkedTo = rcs
      thrusterTransformName = RCS
    }

    TEMPLATE
    {
      templateName = waterfall-rcs-jet-1

      // 绑定喷口
      overrideParentTransform = RCS

      position = 0,-0.2,0
      rotation = 0, 0, 180
      scale = 1.5, 3, 1.5
    }
  }
}