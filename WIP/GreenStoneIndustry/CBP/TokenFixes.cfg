// ==========================================================================
//  GreenStoneIndustry / CBP  --  bulkheadProfile token normalisation
//
//  修正其他模组 part 配置里的大小写/拼写偏差, 使其落到标准档位并继承图标:
//      Size0 -> size0   Size1 -> size1   Size3 -> size3
//      size1.5 -> size1p5      "size 2" -> size2      surf -> srf
//  仅改写 bulkheadProfiles 一个字段, 保留部件原有的其他档位取值。
//  已由 BulkheadProfilesfixes/VABo_fixes.cfg 处理过的部件不在本文件重复。
// ==========================================================================

// Size3->size3   ==>   size3   (79 parts)
@PART[AAmount2|BB41PartHull|CarrierLiftLong|EHInimitz|EHInimitzRadar|FST45SuperMidExt|FST45UpperFwdSuper|FST45superMid|FSTT45SuperTorpedoAft|LargeshipSuperstructureLSS1A|LargeshipSuperstructureLSS1B|LargeshipSuperstructureLSS1C|LargeshipSuperstructureLSS1D|LargeshipSuperstructureLSS1E|LargeshipSuperstructureLSS1F|LargeshipSuperstructureLSS1G|LargeshipSuperstructureLSS1H|LargeshipSuperstructureLSS1I|LargeshipSuperstructureLSS1J|LargeshipSuperstructureLSS1L|LargeshipSuperstructureLSS1M|LargeshipSuperstructureLSS1N|LargeshipSuperstructureLSS1O|LargeshipSuperstructureLSS1P|LargeshipSuperstructureLSS1Q|LargeshipSuperstructureLSS1R|LargeshipSuperstructureLSS1S|LizzyStern2|UDAFwdGunMount|UDAbGunMount|UDAfwdStacks|UDAoverBridgeMount|UDAradarMountB|UDAradarMountC|UDAradarMountD|UDAradarPlinth|UDArearStax|UDAsuperA|UDAsuperB|UDAsuperC|UDAsuperD|UDAsuperE|UDAsuperF|UDAsuperG|UDAsuperH|UdaFWDSuperstructures|UdaHeliHangar|UdaMIdSuperstructures|UdaMountsMasts|UdaSuperstructures|ai_SuperStructureBase|ai_SuperStructureBaseHalf|ai_SuperStructureBaseQuarter|ai_SuperStructureBridge|ai_SuperStructureEnd1|ai_SuperStructureEnd1Quarter|ai_SuperStructureEnd1Short|ai_SuperStructureEnd2|ai_SuperStructureEnd2Quarter|ai_SuperStructureMiddle|ai_SuperStructureMiddleHalf|ai_SuperStructureMiddleQuarter|ai_SuperStructureMiddleShort|ai_hanger|ai_hullBow|ai_hullLong|ai_hullShort|ai_hullShortVLSHalf|ai_hullShortVLs|ai_hullStern|ai_mast|ai_netting|ai_railing|ai_smokestack|carrierShortBow|carriermbow|mediumsternHangarLong|vetteTower2|vetteTower3lit]:NEEDS[Eskandare_Heavy_Industries,LShipParts,SMI_FullSizedMarine,TM5Marine]:FINAL
{
    %bulkheadProfiles = size3
}

// size1.5->size1p5   ==>   size1p5, srf   (13 parts)
@PART[SPO_EnrichedUContainer|SPO_LargeLFO|SPO_LargeMag|SPO_MedMag|SPO_Med_RCS_Tank|SPO_MediumLFO|SPO_MetalContainer|SPO_MetalOreContainer|SPO_OreContainer|SPO_Short_RCS_Tank|SPO_SmallLFO|SPO_SmallMag|SPO_UraniniteContainer]:NEEDS[Orion]:FINAL
{
    %bulkheadProfiles = size1p5, srf
}

// size1.5->size1p5   ==>   size1p5   (7 parts)
@PART[SPO_375mHab|SPO_CrewSpine_Short|SPO_CrewedLab|SPO_RadialCargoBay|SPO_RadialCargoBay_Long|SPO_Smelter|SPO_size15Endcap]:NEEDS[Orion]:FINAL
{
    %bulkheadProfiles = size1p5
}

// size1.5->size1p5   ==>   size1p5, size1   (4 parts)
@PART[SPO_Adapter125|SPO_Adapter125_Std|SPO_Adapter125_Tall_Std|SPO_CommandCapsule]:NEEDS[Orion]:FINAL
{
    %bulkheadProfiles = size1p5, size1
}

// size1.5->size1p5   ==>   size1p5, size3   (4 parts)
@PART[SPO_Adapter375|SPO_Adapter375_Std|SPO_Adapter375_Tall_Std|SPO_Adapter5]:NEEDS[Orion]:FINAL
{
    %bulkheadProfiles = size1p5, size3
}

// size1.5->size1p5   ==>   size1p5, size2   (3 parts)
@PART[SPO_Adapter25|SPO_Adapter25_Std|SPO_Adapter25_Tall_Std]:NEEDS[Orion]:FINAL
{
    %bulkheadProfiles = size1p5, size2
}

// size1.5->size1p5   ==>   size1p5, size5   (1 parts)
@PART[SPO_Adapter5_Std]:NEEDS[Orion]:FINAL
{
    %bulkheadProfiles = size1p5, size5
}

// size 2->size2   ==>   size2   (1 parts)
@PART[M3X_Turbofan]:NEEDS[Mk3Expansion]:FINAL
{
    %bulkheadProfiles = size2
}
