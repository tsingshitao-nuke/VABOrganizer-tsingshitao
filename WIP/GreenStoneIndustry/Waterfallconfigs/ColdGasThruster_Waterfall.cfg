// ColdGasThruster Waterfall Config - HotGasThruster-L & HotGasThruster-M
// These are dual-propellant RCS thrusters (LiquidFuel + Oxidizer)
@PART[HotGasThruster-L]:NEEDS[Waterfall]
{
  !EFFECTS {}
  EFFECTS
  {
    running
    {
      AUDIO_MULTI_POOL
      {
        channel = Ship
        transformName = RCSThrust
        clip = Waterfall/Sounds/Beale_Sounds/Sound_RocketStentor
        volume = 0.0 0.0
        volume = 0.1 0.0
        volume = 0.5 0.04
        volume = 1.0 0.15
        pitch = 1.75
        loop = true
      }
    }
  }
  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = HotGasLFX
    engineID = basicEngine

    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    CONTROLLER
    {
      name = rcs
      linkedTo = rcs
      responseRateUp = 0.7
      responseRateDown = 0.7
    }
    CONTROLLER
    {
      name = R1
      linkedTo = random
      noiseType = perlin
      scale = 1
      minimum = 0
      speed = 12
      seed = 1
    }

    TEMPLATE
    {
      templateName = stock-rcs-kerolox-1
      overrideParentTransform = RCSThrust
      position = 0,0,0
      rotation = 0, 0, 180
      scale = 0.5, 0.5, 0.5
    }
  }
}

