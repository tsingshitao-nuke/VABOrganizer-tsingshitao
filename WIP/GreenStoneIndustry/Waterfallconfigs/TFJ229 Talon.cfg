@PART[SAE_tfj_229_avc]:NEEDS[Waterfall]:FOR[WaterfallRestock]
{
  !EFFECTS {}

  EFFECTS
  {
    fx-tfj-dry-spool
    {
      AUDIO
      {
        channel = Ship
        clip = ModeratelyPlaneRelated/Sounds/fighter_low
        volume = 0.0 0.0
        volume = 0.0001 0.9
        volume = 1.0 1.1
        pitch = 0.0 0.4
        pitch = 1.0 0.85
        loop = true
      }
    }

    fx-tfj-dry-power { }

    fx-tfj-wet-spool
    {
      AUDIO
      {
        channel = Ship
        clip = ModeratelyPlaneRelated/Sounds/fighter_low
        volume = 0.0 0.0
        volume = 0.0001 1.0
        volume = 1.0 1.2
        pitch = 0.0 0.5
        pitch = 1.0 1.4
        loop = true
      }
    }

    fx-tfj-wet-running
    {
      AUDIO
      {
        channel = Ship
        clip = ModeratelyPlaneRelated/Sounds/afterburn_big
        volume = 0.1 0.0
        volume = 0.3 1.0
        volume = 1.0 1.3
        pitch = 0.0 0.6
        pitch = 1.0 1.0
        loop = true
      }
    }
  }

  @MODULE[ModuleEnginesFX],0
  {
    %powerEffectName = fx-tfj-dry-power
    %spoolEffectName = fx-tfj-dry-spool
  }

  @MODULE[ModuleEnginesFX],1
  {
    %runningEffectName = fx-tfj-wet-running
    %spoolEffectName = fx-tfj-wet-spool
  }

  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = TFJDry

    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }

    CONTROLLER
    {
      name = throttle
      linkedTo = throttle
      engineID = Dry
      responseRateUp = 0.012
      responseRateDown = 0.015
    }

    CONTROLLER
    {
      name = mach
      linkedTo = mach
    }

    TEMPLATE
    {
      templateName = stock-kerozine-turbofan-2
      overrideParentTransform = thrustTransform
      position = 0,0,0.0
      rotation = 0,0,0
      scale = 1.1,0.9,1.3
    }
  }

  MODULE
  {
    name = ModuleWaterfallFX
    moduleID = TFJWet

    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }

    CONTROLLER
    {
      name = throttle
      linkedTo = throttle
      engineID = Wet
      responseRateUp = 0.002
      responseRateDown = 0.02
    }

    CONTROLLER
    {
      name = mach
      linkedTo = mach
    }

    TEMPLATE
    {
      templateName = stock-kerozine-afterburner-3
      overrideParentTransform = thrustTransform
      position = 0,0,0.0
      rotation = 0,0,0
      scale = 1.1,0.9,1.35
    }
  }
}
